[project]
name = "backend"
version = "0.1.0"
description = "Backend for video-file-rtsp-streamer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "pydantic>=2.0",
    "psutil==7.1.3",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.43",
    "uvicorn==0.37.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]