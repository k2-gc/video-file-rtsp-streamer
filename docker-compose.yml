version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
     - uploads_data:/app/uploads
     - db_data:/app/data
    environment:
      - PYTHONPATH=/app
      - RTSP_SERVER_HOST=rtsp-server
      - DATABASE_PATH=sqlite:///./data/videos.db
      - ALLOWED_ORIGINS=http://localhost
    depends_on:
      - rtsp-server
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/videos')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
  rtsp-server:
    image: bluenviron/mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
    environment:
      - MTX_RTSPTRANSPORTS=tcp
    networks:
      - app-network
    restart: unless-stopped
networks:
  app-network:
    driver: bridge
volumes:
  db_data:
  uploads_data: